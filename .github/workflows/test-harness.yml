name: BigQuery harness Terraform checks
# The harness itself runs in liquibase-pro's bigquery-harness.yml, on the subtree-sync PR (TECHOPS-1796).
on:
  pull_request:
    paths:
      - "src/test/resources/terraform/**"
      - ".github/workflows/test-harness.yml"
  push:
    branches:
      - "main"
    paths:
      - "src/test/resources/terraform/**"
      - ".github/workflows/test-harness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/test/resources/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same OpenTofu version as the Spacelift stack (default in liquibase-infrastructure spacelift/stack.tf).
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.2"
          tofu_wrapper: false

      - name: Format
        run: tofu fmt -check -diff

      - name: Init
        run: tofu init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: tofu validate -no-color
