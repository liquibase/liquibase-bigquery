name: BigQuery harness Terraform checks
# The harness itself runs in liquibase-pro's bigquery-harness.yml, on the subtree-sync PR (TECHOPS-1796).
on:
  pull_request:
    paths:
      - "src/test/resources/terraform/**"
      - ".github/workflows/test-harness.yml"
  push:
    branches:
      - "main"
    paths:
      - "src/test/resources/terraform/**"
      - ".github/workflows/test-harness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/test/resources/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -diff

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate -no-color
